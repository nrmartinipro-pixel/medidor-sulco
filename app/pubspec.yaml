name: medidor_sulco
description: MVP - profundidade de sulco de pneu pela câmera (laser de linha ou Depth API nativa).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0            # stream YUV420 (Android) / BGRA8888 (iOS)
  shared_preferences: ^2.2.0 # guarda a calibração (fy, cy, Z0, theta, k)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
